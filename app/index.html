<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlantCare AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e8f5e9, #f1f8e9);
            color: #1b4332;
        }

        header {
            background: #1b5e20;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 28px;
        }

        header span {
            font-size: 14px;
            opacity: 0.9;
        }

        .container {
            max-width: 900px;
            margin: 60px auto;
            padding: 20px;
        }

        .hero {
            text-align: center;
            margin-bottom: 35px;
        }

        .hero h2 {
            font-size: 42px;
            margin-bottom: 12px;
            color: #1b5e20;
        }

        .hero p {
            font-size: 18px;
            color: #4f6f52;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
            text-align: center;
        }

        .upload-box {
            border: 2px dashed #66bb6a;
            border-radius: 15px;
            padding: 35px;
            margin-bottom: 25px;
            background: #f8fff8;
        }

        .upload-box p {
            margin-bottom: 15px;
            color: #52745a;
        }

        input[type="file"] {
            margin: 10px;
            padding: 10px;
        }

        button {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 14px 35px;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #1b5e20;
            transform: translateY(-1px);
        }

        button:disabled {
            background: #9e9e9e;
            cursor: not-allowed;
            transform: none;
        }

        #preview {
            max-width: 280px;
            max-height: 280px;
            margin: 20px auto;
            border-radius: 12px;
            display: none;
        }

        #loading {
            display: none;
            margin-top: 20px;
            color: #2e7d32;
            font-weight: bold;
        }

        #result {
            display: none;
            margin-top: 30px;
            padding: 25px;
            border-radius: 15px;
            background: #e8f5e9;
        }

        #result h3 {
            color: #1b5e20;
            margin-bottom: 12px;
        }

        .prediction {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .confidence {
            font-size: 18px;
            color: #52745a;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #66806b;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .hero h2 {
                font-size: 32px;
            }

            .card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🌱 PlantCare AI</h1>
    <span>AI-Powered Plant Disease Detection</span>
</header>

<div class="container">

    <div class="hero">
        <h2>Detect Plant Diseases</h2>
        <p>Upload a leaf image and let AI analyze it.</p>
    </div>

    <div class="card">

        <div class="upload-box">
            <p>Select a clear image of a plant leaf</p>

            <input
                type="file"
                id="fileInput"
                accept="image/*"
            >

            <img id="preview" alt="Leaf preview">
        </div>

        <button id="predictButton" onclick="predictDisease()">
            Predict Disease
        </button>

        <div id="loading">
            🔍 Analyzing your plant...
        </div>

        <div id="result">
            <h3>Prediction Result</h3>

            <div class="prediction" id="prediction"></div>

            <div class="confidence" id="confidence"></div>
        </div>

    </div>

</div>

<footer>
    PlantCare AI • End-to-End Machine Learning Deployment
</footer>


<script>

const fileInput = document.getElementById("fileInput");
const preview = document.getElementById("preview");

fileInput.addEventListener("change", function () {

    const file = fileInput.files[0];

    if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
    }

});


async function predictDisease() {

    const file = fileInput.files[0];

    if (!file) {
        alert("Please select a plant leaf image first.");
        return;
    }

    const button = document.getElementById("predictButton");
    const loading = document.getElementById("loading");
    const result = document.getElementById("result");

    button.disabled = true;
    loading.style.display = "block";
    result.style.display = "none";

    const formData = new FormData();
    formData.append("file", file);

    try {

        const response = await fetch("/predict", {
            method: "POST",
            body: formData
        });

        if (!response.ok) {
            throw new Error("Prediction failed");
        }

        const data = await response.json();

        document.getElementById("prediction").textContent =
            data.prediction;

        document.getElementById("confidence").textContent =
            "Confidence: " + data.confidence + "%";

        result.style.display = "block";

    } catch (error) {

        alert("Something went wrong while predicting the disease.");

        console.error(error);

    } finally {

        button.disabled = false;
        loading.style.display = "none";

    }
}

</script>

</body>
</html>
